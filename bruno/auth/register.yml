info:
  name: Register
  type: http
  seq: 1
  tags:
    - RegisterUser

http:
  method: POST
  url: "{{baseUrl}}/api/register"
  headers:
    - name: Idempotency-Key
      value: "{{idempotencyKey}}"
  body:
    type: json
    data: |-
      {
        "name": "Bruno User",
        "email": "{{email}}",
        "password": "{{password}}",
        "password_confirmation": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = Date.now();
        bru.setVar("email", `bruno+${suffix}@example.com`);
        bru.setVar("idempotencyKey", `register-${suffix}`);
    - type: tests
      code: |-
        test("returns 201", function () {
          expect(res.status).to.equal(201);
        });

        test("returns the created user", function () {
          expect(res.body.id).to.be.a("string");
          expect(res.body.name).to.equal("Bruno User");
          expect(res.body.email).to.equal(bru.getVar("email"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: "`UserResource`"
    request:
      url: "{{baseUrl}}/api/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "email": "",
            "password": "",
            "password_confirmation": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "email": ""
          }
  - name: 422 Response
    description: Validation error
    request:
      url: "{{baseUrl}}/api/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "email": "",
            "password": "",
            "password_confirmation": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "errors": {}
          }
