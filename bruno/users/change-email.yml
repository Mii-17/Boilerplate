info:
  name: Change email
  type: http
  seq: 2
  tags:
    - ChangeUnverifiedEmail

http:
  method: PATCH
  url: "{{baseUrl}}/api/user/email"
  body:
    type: json
    data: |-
      {
        "email": "{{newEmail}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("newEmail", `bruno+changed+${Date.now()}@example.com`);
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("returns the updated email", function () {
          expect(res.body.id).to.be.a("string");
          expect(res.body.email).to.equal(bru.getVar("newEmail"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: "`EmailChangeResource`"
    request:
      url: "{{baseUrl}}/api/user/email"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "email": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "email": ""
          }
  - name: 401 Response
    description: Unauthenticated
    request:
      url: "{{baseUrl}}/api/user/email"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "email": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 422 Response
    description: Validation error
    request:
      url: "{{baseUrl}}/api/user/email"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "email": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "",
            "errors": {}
          }
