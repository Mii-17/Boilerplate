services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: boilerplate_app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    volumes:
      - .:/var/www/html
    networks:
      - boilerplate_network
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003

  web:
    image: nginx:alpine
    container_name: boilerplate_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - boilerplate_network

  db:
    image: postgres:16-alpine
    container_name: boilerplate_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-boilerplate}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - boilerplate_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: boilerplate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - boilerplate_network

  mailpit:
    image: axllent/mailpit
    container_name: boilerplate_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - boilerplate_network

networks:
  boilerplate_network:
    driver: bridge

volumes:
  pgdata:
  redisdata: