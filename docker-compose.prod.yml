name: boilerplate_prod

services:
  # ==============================================================================
  # 1. PHP-FPM Application Server (Main Web Backend)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: boilerplate_app_prod
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - storage_prod:/var/www/html/storage
    networks:
      - boilerplate_prod_network
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/index.php SCRIPT_FILENAME=/var/www/html/public/index.php REQUEST_URI=/up REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q 'Application up'"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==============================================================================
  # 2. Nginx Web Server (Reverse Proxy)
  # ==============================================================================
  web:
    image: nginx:alpine
    container_name: boilerplate_web_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - boilerplate_prod_network

  # ==============================================================================
  # 3. PostgreSQL Database
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: boilerplate_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - boilerplate_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 4. Redis Cache & Queue Broker
  # ==============================================================================
  redis:
    image: redis:alpine
    container_name: boilerplate_redis_prod
    restart: unless-stopped
    volumes:
      - redisdata_prod:/data
    networks:
      - boilerplate_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==============================================================================
  # 5. Laravel Queue Worker
  # ==============================================================================
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: boilerplate_queue_prod
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.production
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boilerplate_prod_network

  # ==============================================================================
  # 6. Laravel Task Scheduler
  # ==============================================================================
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: boilerplate_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.production
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boilerplate_prod_network

# ==============================================================================
# Isolated Virtual Networks
# ==============================================================================
networks:
  boilerplate_prod_network:
    name: boilerplate_prod_network
    driver: bridge

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  pgdata_prod:
    name: boilerplate_pgdata_prod
  redisdata_prod:
    name: boilerplate_redisdata_prod
  storage_prod:
    name: boilerplate_storage_prod